spring:
  application:
    name: suabhi-cab-booking-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/suabhi_cab_booking_db}
    username: ${DATABASE_USERNAME:cab_booking_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      pool-name: SuabhiCabHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SUABHISESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
app:
  security:
    csrf-cookie-secure: ${CSRF_COOKIE_SECURE:false}
    hsts-enabled: ${HSTS_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  maps:
    google:
      enabled: ${GOOGLE_MAPS_ENABLED:false}
      api-key: ${GOOGLE_MAPS_API_KEY:}
      connect-timeout: ${GOOGLE_MAPS_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_MAPS_READ_TIMEOUT:8s}
      requests-per-second: ${GOOGLE_MAPS_REQUESTS_PER_SECOND:8}
      max-suggestions: ${GOOGLE_MAPS_MAX_SUGGESTIONS:5}
logging:
  level:
    root: INFO
    com.suabhi.cabbooking: INFO
